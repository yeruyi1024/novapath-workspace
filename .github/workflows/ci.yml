name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  quality:
    name: Compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            SKILLs/*/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.17.0 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare Electron binary and Linux libraries
        run: |
          node node_modules/electron/install.js
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0t64 libasound2t64
      - name: Lint changed TypeScript
        run: node scripts/ci-lint-changed.cjs
      - name: Build renderer and Electron main process
        run: |
          npm run build
          npm run compile:electron
      - name: Build locked skill dependencies
        run: node scripts/ci-prepare-skills.cjs
      - name: Run tests
        run: npm test -- --maxWorkers=2
      - name: Verify compiled output
        run: node scripts/ci-verify-output.cjs
