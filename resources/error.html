<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星途 NovaPath</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #242424; }
    main { max-width: 440px; padding: 32px; text-align: center; }
    h1 { font-size: 22px; } p { color: #737373; line-height: 1.7; }
    button { padding: 10px 20px; border-radius: 12px; border: 1px solid #dedede; background: #f5f5f5; color: inherit; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #7166e8; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { body { background: #212121; color: #eee; } p { color: #aaa; } button { background: #303030; border-color: #555; } }
  </style>
  <script src="recovery.js" defer></script>
</head>
<body>
  <main>
    <p>星途 NovaPath</p>
    <h1 id="title">界面暂时无法加载</h1>
    <p id="hint">请重试。已保存的项目和对话会保留，无需清空配置。</p>
    <button id="retry" type="button">重新加载</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
