<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星途 NovaPath</title>
    <link rel="stylesheet" href="/src/renderer/components/cowork/engineStartup.css" />
    <script src="/startup.js"></script>
  </head>
  <body>
    <!-- Same markup and stylesheet as EngineStartupOverlay for a quiet handoff. -->
    <div id="root">
      <div id="startup-shell" class="starpath-startup" role="status" aria-live="polite" aria-busy="true">
        <div class="starpath-startup-content">
          <div class="starpath-startup-brand">
            <img class="starpath-startup-logo" src="logo.svg" alt="" width="40" height="40" draggable="false" />
            <h1 class="starpath-startup-title">星途 NovaPath</h1>
          </div>
          <p class="starpath-startup-subtitle">
            <span class="starpath-startup-copy-zh">AI 工作空间</span>
            <span class="starpath-startup-copy-en">AI workspace</span>
          </p>
          <div class="starpath-startup-status">
            <span class="starpath-startup-dots" aria-hidden="true">
              <span class="starpath-startup-dot"></span>
              <span class="starpath-startup-dot"></span>
              <span class="starpath-startup-dot"></span>
            </span>
            <span class="starpath-startup-copy-zh">正在准备工作空间</span>
            <span class="starpath-startup-copy-en">Preparing your workspace</span>
          </div>
          <p class="starpath-startup-slow" style="visibility: hidden" aria-hidden="true"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
